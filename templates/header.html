<!-- header.html -->
<header class="site-header">
    <div class="nav-container">
        <!-- Brand -->
        <a href="/certificates" class="brand-wrapper" title="HomeLab Certificate Manager">
            <div class="brand-logo-glow">
                <img src="/static/favicon.ico" alt="Logo">
            </div>
            <span class="brand-title">HomeLab CA</span>
        </a>


        <!-- Right Side Actions -->
        <div class="nav-actions">
            <!-- Session Timer Pill -->
            <div id="session-timer-badge" class="session-timer-pill" title="Session timeout countdown (resets on interaction)">
                <span class="session-pulse-dot"></span>
                <i class="material-icons" style="font-size: 14px;">timer</i>
                <span id="session-countdown">--:--</span>
            </div>

            <!-- Help Link -->
            <a href="/help" class="btn-icon-nav" title="Help & Documentation" aria-label="Help">
                <i class="material-icons">help_outline</i>
            </a>

            <!-- Theme Toggle Switch -->
            <button id="theme-switch" class="btn-icon-nav" type="button" onclick="toggleTheme()" title="Toggle color theme" aria-label="Toggle theme">
                <i class="material-icons">light_mode</i>
            </button>

            <!-- Admin Profile & Dropdown -->
            <div class="profile-dropdown-container">
                <button id="profileButton" class="btn-profile" type="button" aria-expanded="false" aria-haspopup="true">
                    <span class="avatar-badge">A</span>
                    <span>Admin</span>
                    <i class="material-icons" style="font-size: 16px;">expand_more</i>
                </button>

                <!-- Modern Dropdown Menu -->
                <ul id="dropdown1" class="dropdown-menu-box hidden" role="menu">
                    <li role="none">
                        <a href="/settings" role="menuitem">
                            <i class="material-icons">tune</i>
                            <span>Settings</span>
                        </a>
                    </li>
                    <li role="none">
                        <a href="/help" role="menuitem">
                            <i class="material-icons">help_outline</i>
                            <span>Help & Docs</span>
                        </a>
                    </li>
                    <li role="none">
                        <a href="/change-password" role="menuitem">
                            <i class="material-icons">lock_reset</i>
                            <span>Change Password</span>
                        </a>
                    </li>
                    <li class="divider" role="separator"></li>
                    <li role="none">
                        <a href="/logout" class="logout-link" role="menuitem">
                            <i class="material-icons">logout</i>
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Security Warning for Default Password -->
    {{ if .defaultPassword }}
    <div class="security-warning-bar" role="alert">
        <i class="material-icons" style="color: var(--accent-warning);">warning</i>
        <span>Security Warning: The default password is active. Please update your password immediately in <a href="/change-password">Change Password</a>.</span>
    </div>
    {{ end }}

    <input type="hidden" id="session_csrf_token" value="{{.csrfToken}}">
</header>

<script>

// Modern Profile Dropdown Logic (Native JS)
document.addEventListener('DOMContentLoaded', function() {
    const profileBtn = document.getElementById('profileButton');
    const dropdown = document.getElementById('dropdown1');

    if (profileBtn && dropdown) {
        profileBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const isHidden = dropdown.classList.toggle('hidden');
            profileBtn.setAttribute('aria-expanded', !isHidden);
        });

        document.addEventListener('click', function(e) {
            if (!dropdown.contains(e.target) && !profileBtn.contains(e.target)) {
                dropdown.classList.add('hidden');
                profileBtn.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !dropdown.classList.contains('hidden')) {
                dropdown.classList.add('hidden');
                profileBtn.setAttribute('aria-expanded', 'false');
                profileBtn.focus();
            }
        });
    }

    // Apply initial theme icon state
    updateThemeIcon();
});

// Theme Management
function updateThemeIcon() {
    const theme = document.documentElement.getAttribute('theme') || localStorage.getItem('theme') || 'dark';
    const icon = document.querySelector('#theme-switch i');
    if (icon) {
        icon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
    }
}

function toggleTheme() {
    const current = document.documentElement.getAttribute('theme') || localStorage.getItem('theme') || 'dark';
    const nextTheme = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('theme', nextTheme);
    localStorage.setItem('theme', nextTheme);
    updateThemeIcon();
}

// Session Inactivity Countdown & Ping Management
(function() {
    let remainingSeconds = 0;
    let totalTimeoutSeconds = 120;
    let timerInterval = null;
    let lastPingTime = Date.now();
    let isRedirecting = false;

    function getSessionCsrf() {
        const el = document.getElementById('session_csrf_token') || document.querySelector('input[name="csrf_token"]');
        return el ? el.value : '';
    }

    function updateDisplay() {
        const countdownEl = document.getElementById('session-countdown');
        const badgeEl = document.getElementById('session-timer-badge');
        if (!countdownEl) return;

        const mins = Math.floor(Math.max(0, remainingSeconds) / 60);
        const secs = Math.max(0, remainingSeconds) % 60;
        countdownEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (badgeEl) {
            if (remainingSeconds <= 60) {
                badgeEl.classList.add('warning');
            } else {
                badgeEl.classList.remove('warning');
            }
        }
    }

    function handleExpiry() {
        if (isRedirecting) return;
        isRedirecting = true;
        if (timerInterval) clearInterval(timerInterval);
        window.location.href = '/login?timeout=1';
    }

    function sendPing() {
        const csrfToken = getSessionCsrf();
        const headers = { 'X-Requested-With': 'XMLHttpRequest' };
        if (csrfToken) {
            headers['X-CSRF-Token'] = csrfToken;
        }
        fetch('/api/session/ping', {
            method: 'POST',
            headers: headers
        })
        .then(res => {
            if (res.status === 401) {
                handleExpiry();
                return null;
            }
            return res.json();
        })
        .then(data => {
            if (data && typeof data.remaining_seconds === 'number') {
                remainingSeconds = data.remaining_seconds;
                if (data.timeout_minutes) {
                    totalTimeoutSeconds = data.timeout_minutes * 60;
                }
                updateDisplay();
            }
        })
        .catch(err => {
            console.error('Session ping error:', err);
        });
    }

    function onUserInteraction() {
        if (isRedirecting) return;
        remainingSeconds = totalTimeoutSeconds;
        updateDisplay();

        const now = Date.now();
        if (now - lastPingTime > 15000) {
            lastPingTime = now;
            sendPing();
        }
    }

    window.initSessionTimer = function() {
        fetch('/api/session/status', {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(res => {
            if (res.status === 401) {
                handleExpiry();
                return null;
            }
            return res.json();
        })
        .then(data => {
            if (!data) return;
            totalTimeoutSeconds = (data.timeout_minutes || 2) * 60;
            remainingSeconds = (typeof data.remaining_seconds === 'number') ? data.remaining_seconds : totalTimeoutSeconds;
            updateDisplay();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateDisplay();
                } else {
                    handleExpiry();
                }
            }, 1000);
        })
        .catch(err => {
            console.error('Failed to get session status:', err);
        });
    };

    document.addEventListener('DOMContentLoaded', function() {
        window.initSessionTimer();

        const activityEvents = ['mousedown', 'keydown', 'scroll', 'touchstart', 'click'];
        activityEvents.forEach(evt => {
            window.addEventListener(evt, onUserInteraction, { passive: true });
        });
    });
})();
</script>
