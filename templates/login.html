<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - HomeLab Certificate Manager</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <!-- Modern Design System -->
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('theme', theme);
    </script>
</head>
<body>
    <div class="login-page-wrapper">
        <!-- Top Right Theme Switcher -->
        <div style="position: absolute; top: 20px; right: 24px;">
            <button id="theme-switch" class="btn-icon-nav" type="button" onclick="toggleTheme()" title="Toggle color theme" aria-label="Toggle theme">
                <i class="material-icons">light_mode</i>
            </button>
        </div>

        <!-- Glassmorphic Login Card -->
        <div class="login-card-glass">
            <!-- Shield Icon Emblem -->
            <div class="login-emblem">
                <i class="material-icons">shield</i>
            </div>

            <!-- Header Titles -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em;">
                    HomeLab Certificate Authority
                </h1>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.35rem;">
                    Sign in to manage your local SSL/TLS certificates
                </p>
            </div>

            <!-- Error Banner -->
            {{ if .error }}
            <div class="alert-banner-error" role="alert">
                <i class="material-icons">error</i>
                <span>{{ .error }}</span>
            </div>
            {{ end }}

            <!-- Login Form -->
            <form action="/login" method="POST" id="loginForm">
                <input type="hidden" name="csrf_token" value="{{ .csrfToken }}">

                <!-- Username Input -->
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-with-icon">
                        <i class="material-icons input-leading-icon">person</i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            autocomplete="username" 
                            placeholder="Enter your username" 
                            required 
                            autofocus
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group" style="margin-top: 1.25rem;">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="material-icons input-leading-icon">lock</i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            autocomplete="current-password" 
                            placeholder="Enter your password" 
                            required
                        >
                        <button type="button" class="input-trailing-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                            <i id="passwordToggleIcon" class="material-icons" style="font-size: 18px;">visibility</i>
                        </button>
                    </div>
                </div>

                <!-- Sign In Button -->
                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
                        <span>Sign In</span>
                        <i class="material-icons" style="font-size: 18px;">arrow_forward</i>
                    </button>
                </div>
            </form>

            <!-- Bottom Security Badge -->
            <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; gap: 0.45rem; font-size: 0.75rem; color: var(--text-muted);">
                <i class="material-icons" style="font-size: 14px; color: var(--accent-success);">verified_user</i>
                <span>Protected with TLS 1.2+ & Session Timeout</span>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function updateThemeIcon() {
            const theme = document.documentElement.getAttribute('theme') || localStorage.getItem('theme') || 'dark';
            const icon = document.querySelector('#theme-switch i');
            if (icon) {
                icon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('theme') || localStorage.getItem('theme') || 'dark';
            const nextTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('theme', nextTheme);
            localStorage.setItem('theme', nextTheme);
            updateThemeIcon();
        }

        document.addEventListener('DOMContentLoaded', updateThemeIcon);
    </script>
</body>
</html>
