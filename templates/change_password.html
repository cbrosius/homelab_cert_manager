<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Change Password - HomeLab Certificate Manager</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="/static/materialize/materialize.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('theme', theme);
    </script>
    <style>
        .password-requirements {
            font-size: 0.85rem;
            margin-bottom: 15px;
            padding: 8px 12px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.04);
            color: #666;
        }
        [theme='dark'] .password-requirements {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
        }
        .alert-box {
            display: none;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .alert-error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        [theme='dark'] .alert-error {
            background-color: rgba(198, 40, 40, 0.2);
            color: #ef9a9a;
            border-color: rgba(198, 40, 40, 0.4);
        }
        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        [theme='dark'] .alert-success {
            background-color: rgba(46, 125, 50, 0.2);
            color: #a5d6a7;
            border-color: rgba(46, 125, 50, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="center-align" style="font-size: 2.2rem; margin-top: 30px;">Change Password</h1>
        {{if .MustChangePassword}}
        <p class="center-align red-text" style="font-weight: 500;">You must change the default password before you can continue.</p>
        {{end}}
        <div class="row">
            <div class="col s12 m8 offset-m2 l6 offset-l3">
                <div class="card">
                    <div class="card-content">
                        <div id="alert-error" class="alert-box alert-error"></div>
                        <div id="alert-success" class="alert-box alert-success"></div>

                        <div class="password-requirements">
                            <strong>Password Requirements:</strong>
                            <ul style="margin: 4px 0 0 16px; list-style-type: disc;">
                                <li>At least 8 characters long</li>
                                <li>Cannot be "admin"</li>
                                <li>Must be different from your current password</li>
                            </ul>
                        </div>

                        <form id="change-password-form">
                            <input type="hidden" name="csrf_token" value="{{.csrfToken}}">
                            <div class="input-field">
                                <input id="old_password" type="password" name="old_password" autocomplete="current-password" required>
                                <label for="old_password">Old Password</label>
                            </div>
                            <div class="input-field">
                                <input id="new_password" type="password" name="new_password" autocomplete="new-password" minlength="8" maxlength="72" required>
                                <label for="new_password">New Password</label>
                            </div>
                            <div class="input-field">
                                <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="72" required>
                                <label for="confirm_password">Confirm New Password</label>
                            </div>
                            <div class="center-align" style="margin-top: 25px;">
                                <button id="submit-btn" class="btn waves-effect waves-light" type="submit" name="action">
                                    Change Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Materialize JavaScript -->
    <script src="/static/materialize/materialize.js"></script>
    <script>
        function showAlert(type, message) {
            const errBox = document.getElementById('alert-error');
            const succBox = document.getElementById('alert-success');
            if (type === 'error') {
                if (succBox) succBox.style.display = 'none';
                if (errBox) {
                    errBox.textContent = message;
                    errBox.style.display = 'block';
                }
                showToast(message, 'red');
            } else if (type === 'success') {
                if (errBox) errBox.style.display = 'none';
                if (succBox) {
                    succBox.textContent = message;
                    succBox.style.display = 'block';
                }
                showToast(message, 'green');
            }
        }

        function showToast(message, colorClass) {
            if (window.M && M.Toast) {
                try {
                    new M.Toast({ text: message, classes: colorClass });
                    return;
                } catch (e) {
                    console.warn('Toast display error:', e);
                }
            }
            if (window.M && typeof M.toast === 'function') {
                try {
                    M.toast({ text: message, classes: colorClass });
                } catch (e) {}
            }
        }

        document.getElementById('change-password-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const oldPassword = document.getElementById('old_password').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const csrfTokenInput = document.querySelector('input[name="csrf_token"]');
            const csrfToken = csrfTokenInput ? csrfTokenInput.value : '';

            // Client-side validations
            if (newPassword !== confirmPassword) {
                showAlert('error', 'New passwords do not match');
                return;
            }
            if (newPassword.length < 8) {
                showAlert('error', 'New password must be at least 8 characters long');
                return;
            }
            if (newPassword.toLowerCase() === 'admin') {
                showAlert('error', 'Password cannot be "admin"');
                return;
            }
            if (oldPassword && newPassword === oldPassword) {
                showAlert('error', 'New password must be different from current password');
                return;
            }

            // Disable button during submission
            submitBtn.disabled = true;
            submitBtn.textContent = 'Changing Password...';

            fetch('/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfToken
                },
                body: JSON.stringify({
                    old_password: oldPassword,
                    new_password: newPassword
                })
            })
            .then(response => {
                return response.json().then(data => ({
                    status: response.status,
                    ok: response.ok,
                    data: data
                })).catch(() => ({
                    status: response.status,
                    ok: response.ok,
                    data: { message: response.statusText || 'Unexpected response' }
                }));
            })
            .then(result => {
                if (result.ok && result.data && result.data.success) {
                    showAlert('success', 'Password changed successfully! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Change Password';
                    const msg = (result.data && result.data.message) || 'Error changing password';
                    showAlert('error', msg);
                }
            })
            .catch(error => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Change Password';
                showAlert('error', 'A network error occurred. Please try again.');
            });
        });
    </script>
</body>

</html>
