name: Sync Wiki Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Git Configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone and Sync Wiki Repository
        run: |
          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          TEMP_WIKI="/tmp/github_wiki"

          echo "==> Cloning wiki repository..."
          git clone "${WIKI_URL}" "${TEMP_WIKI}"

          echo "==> Syncing markdown files from wiki/..."
          rsync -av --delete --exclude='.git/' ./wiki/ "${TEMP_WIKI}/"

          cd "${TEMP_WIKI}"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "==> Detected changes, committing and pushing to wiki..."
            git add -A
            git commit -m "docs(wiki): automated synchronization from main repo [skip ci]"
            git push origin master || git push origin main
            echo "==> Wiki synchronized successfully!"
          else
            echo "==> No changes detected. Wiki is up to date."
          fi
